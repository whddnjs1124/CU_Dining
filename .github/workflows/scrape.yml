name: scrape

on:
  schedule:
    # Every three hours. Half-hourly was pointless: 185 consecutive scrapes
    # produced zero change beyond the timestamp, and Columbia publishes menus
    # in bulk months ahead (208 nodes already exist for Sept 4 - Nov 1), so
    # there is nothing that changes on a half-hour scale. The lighter footprint
    # also matters -- Cloudflare started blocking the runner outright.
    # 00/03/06/09/12/15/18/21 UTC lands near breakfast, lunch and dinner in NY.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Only one scrape at a time -- two runs pushing to main would collide. Newer
# runs win: a run that is struggling has nothing a later one won't redo, and
# queueing behind it once left a run stuck for 53 minutes with others piling up.
concurrency:
  group: scrape
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A healthy run takes under a minute. Anything past this is wedged, and
    # dying quickly beats holding the queue.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      # Fails loudly rather than writing a partial dining.json.
      - run: python scrape.py

      # Runs against the payload we just captured, so a markup change on
      # Columbia's side fails the job instead of publishing empty data.
      - run: pytest -q

      - name: Commit
        run: |
          git config user.name  "dining-scraper"
          git config user.email "actions@github.com"
          git add dining.json fixtures/globals.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
