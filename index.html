<html lang="en">

<title>Columbia Dining — what's open now</title>

     crossing it. Inline, so there is still no second request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fbfaf7'/%3E%3Crect x='4' y='12' width='24' height='8' rx='1.5' fill='%23b9d9eb'/%3E%3Crect x='4' y='12' width='11' height='8' rx='1.5' fill='%238ba9bd'/%3E%3Crect x='14.2' y='6' width='2' height='20' fill='%239a7b3f'/%3E%3C/svg%3E">

<style>
/* Columbia's own materials, not the usual collegiate navy:
   Pantone 290 "Columbia Blue" is pale, and McKim's limestone is warm-white.
   Brass appears exactly once, on the sundial line that marks now. */
:root {
  --paper:#fbfaf7; --card:#ffffff; --stone:#e4e0d6; --hair:#eeebe3;
  --ink:#14161a;   --dim:#6b6963;  --blue:#b9d9eb;  --blue-deep:#005587;
  --brass:#9a7b3f; --shut:#8b8985;
  --open-bg:#eaf4fa; --soon-bg:#fbf3e4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#101215; --card:#171a1e; --stone:#2a2e33; --hair:#23272c;
    --ink:#e9e8e4;   --dim:#96948e;  --blue:#b9d9eb;  --blue-deep:#8dc6ea;
    --brass:#d7b26a; --shut:#84827d;
    --open-bg:#15242e; --soon-bg:#2b2313;
  }
}
:root[data-theme="light"] {
  --paper:#fbfaf7; --card:#ffffff; --stone:#e4e0d6; --hair:#eeebe3;
  --ink:#14161a; --dim:#6b6963; --blue:#b9d9eb; --blue-deep:#005587;
  --brass:#9a7b3f; --shut:#8b8985; --open-bg:#eaf4fa; --soon-bg:#fbf3e4;
}
:root[data-theme="dark"] {
  --paper:#101215; --card:#171a1e; --stone:#2a2e33; --hair:#23272c;
  --ink:#e9e8e4; --dim:#96948e; --blue:#b9d9eb; --blue-deep:#8dc6ea;
  --brass:#d7b26a; --shut:#84827d; --open-bg:#15242e; --soon-bg:#2b2313;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
/* Installed to the home screen the page runs full-bleed, so the masthead
   would sit under the notch without these insets. They resolve to 0 in a
   normal browser tab. */
.wrap {
  max-width: 48rem; margin: 0 auto;
  padding: calc(2rem + env(safe-area-inset-top)) calc(1.15rem + env(safe-area-inset-right))
           calc(4rem + env(safe-area-inset-bottom)) calc(1.15rem + env(safe-area-inset-left));
}

/* Carved caps: Georgia and its cousins are the most chiselled faces every
   machine already has, so the masthead costs zero requests. */
.carved {
  font-family: "Iowan Old Style", Georgia, "Palatino Linotype", Palatino, serif;
  text-transform: uppercase; letter-spacing: .16em; font-weight: 400;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  font-variant-numeric: tabular-nums;
}

/* ---------- masthead ---------- */
header h1 { font-size: 1.3rem; margin: 0; line-height: 1.1; }
.stamp {
  margin: .55rem 0 0; font-size: .75rem; color: var(--dim);
  letter-spacing: .04em;
}
.rule { height: 1px; background: var(--stone); margin: 1.1rem 0 0; }

.banner {
  margin: 1.15rem 0 0; padding: .75rem .9rem; border-radius: .35rem;
  font-size: .875rem; background: var(--soon-bg); color: var(--ink);
  border-left: 2px solid var(--brass);
}
.banner.quiet { background: transparent; border-left-color: var(--stone); color: var(--dim); }
.banner strong { color: var(--ink); }
.banner a { color: var(--blue-deep); }

/* ---------- the ribbon: a sundial for the dining day ---------- */
.dial { margin: 1.6rem 0 0; position: relative; }
.dial h2, .list h2 {
  font-size: .6875rem; letter-spacing: .18em; color: var(--dim);
  margin: 0 0 .8rem; font-weight: 600; text-transform: uppercase;
}
.grid { position: relative; }
.ticks {
  display: flex; margin-left: var(--gutter); position: relative;
  height: 1rem; font-size: .625rem; color: var(--dim);
}
.ticks span { position: absolute; transform: translateX(-50%); letter-spacing: .06em; }
.dial { --gutter: 6.25rem; }
@media (max-width: 24rem) { .dial { --gutter: 5rem; } }

/* Fixed row height keeps the bars evenly spaced whether a name takes one
   line or two; shortName() is responsible for never needing three. */
.row { display: flex; align-items: center; gap: 0; min-height: 1.9rem; }
.rname {
  width: var(--gutter); flex: none; padding-right: .6rem; font-size: .625rem;
  line-height: 1.15; text-align: right; color: var(--ink);
  letter-spacing: .04em; hyphens: none; overflow-wrap: normal;
}
.row.shut .rname { color: var(--dim); }
/* Group divider inside the ribbon: label in the name gutter, rule across the
   time axis, so both groups keep sharing one clock. */
.row.glab { min-height: 1.5rem; }
.row.glab .rname { font-size: .5625rem; letter-spacing: .15em; color: var(--dim); }
.gline { flex: 1; height: 1px; background: var(--stone); }
/* Three-hour gridlines, matching the ticks above -- enough to read a bar
   against, not so much that the empty track becomes texture. */
.track {
  position: relative; flex: 1; height: 1.15rem; border-radius: .1rem;
  background: repeating-linear-gradient(90deg,
    var(--hair) 0 1px, transparent 1px calc(100% / 6.667));
}
.bar {
  position: absolute; top: 0; bottom: 0; background: var(--blue);
  border-radius: .1rem; transform-origin: left center; overflow: hidden;
}
/* The sundial's shadow: the part of a service window already spent. */
.bar i {
  position: absolute; inset: 0 auto 0 0; display: block;
  background: var(--spent);
}
:root { --spent: rgba(20,22,26,.13); }
@media (prefers-color-scheme: dark) { :root { --spent: rgba(0,0,0,.42); } }
:root[data-theme="light"] { --spent: rgba(20,22,26,.13); }
:root[data-theme="dark"] { --spent: rgba(0,0,0,.42); }
/* Service that runs past the window edge, e.g. JJ's Place until 10am. */
.bar.spill { border-top-right-radius: 0; border-bottom-right-radius: 0; }

.now {
  position: absolute; top: 1rem; bottom: 1.1rem; width: 2px; background: var(--brass);
  pointer-events: none;
}
.now::before {
  content: ""; position: absolute; top: -5px; left: 50%; width: 0; height: 0;
  transform: translateX(-50%);
  border-left: 4.5px solid transparent; border-right: 4.5px solid transparent;
  border-top: 7px solid var(--brass);
}
/* Sits under the last row, clear of the hour ticks it would otherwise sit on. */
.nowlab {
  position: absolute; bottom: -1rem; font-size: .5625rem; color: var(--brass);
  letter-spacing: .12em; transform: translateX(-50%); white-space: nowrap;
}
.grid { padding-bottom: 1.1rem; }
@media (prefers-reduced-motion: no-preference) {
  .bar { animation: draw .5s cubic-bezier(.2,.7,.3,1) backwards; }
  .now, .nowlab { animation: fade .4s .45s backwards; }
  @keyframes draw { from { transform: scaleX(0); } }
  @keyframes fade { from { opacity: 0; } }
}

/* ---------- location list ---------- */
.list { margin-top: 2.4rem; }
.card {
  background: var(--card); border: 1px solid var(--hair);
  border-radius: .4rem; padding: .85rem 1rem; margin-bottom: .5rem;
}
.card.open, .card.closing { border-left: 2px solid var(--blue-deep); }
.card.opening { border-left: 2px solid var(--brass); }

.top { display: flex; gap: .75rem; align-items: baseline; justify-content: space-between; }
.name { font-size: .75rem; letter-spacing: .07em; }
.name a { color: inherit; text-decoration: none; }
.name a:hover { text-decoration: underline; text-underline-offset: .2em; }
.pill { flex: none; font-size: .6875rem; letter-spacing: .04em; color: var(--shut); white-space: nowrap; }
.pill.open, .pill.closing { color: var(--blue-deep); font-weight: 600; }
.pill.opening { color: var(--brass); font-weight: 600; }

.detail { margin-top: .3rem; font-size: .8125rem; color: var(--dim); }
.detail div + div { margin-top: .05rem; }
.detail .lead { color: var(--ink); }

details { margin-top: .65rem; }
summary { cursor: pointer; font-size: .75rem; letter-spacing: .08em; color: var(--blue-deep); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+ "; }
details[open] summary::before { content: "\2212 "; }
/* Each meal is its own disclosure, so several can be open at once. */
.meal { margin-top: .5rem; border-top: 1px solid var(--hair); padding-top: .5rem; }
/* The meal is the category, so it outranks the station inside it. */
.meal > summary { font-size: .8125rem; letter-spacing: .12em; text-transform: uppercase; }
.meal .when { text-transform: none; letter-spacing: 0; color: var(--dim); margin-left: .3rem; }
.nowtag {
  font-size: .5625rem; letter-spacing: .12em; color: var(--brass);
  border: 1px solid currentColor; border-radius: .15rem; padding: 0 .2rem;
  margin-left: .3rem; vertical-align: .05em;
}
.meal[open] > summary { margin-bottom: .45rem; }
.station { margin: 0 0 .55rem; }
.station > strong { font-size: .6875rem; letter-spacing: .08em; font-weight: 600; color: var(--dim); text-transform: uppercase; }
.station ul { margin: .1rem 0 0; padding-left: 1rem; font-size: .875rem; }
.tag {
  font-size: .625rem; letter-spacing: .05em; color: var(--dim);
  border: 1px solid var(--stone); border-radius: .15rem; padding: 0 .25rem;
  margin-left: .3rem; white-space: nowrap;
}

a:focus-visible, summary:focus-visible {
  outline: 2px solid var(--brass); outline-offset: 2px; border-radius: .1rem;
}
footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--stone);
  font-size: .75rem; color: var(--dim); }
footer a { color: var(--blue-deep); }
#selftest { white-space: pre-wrap; font-size: .8125rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="carved">Columbia Dining</h1>
    <p class="stamp mono" id="stamp">Loading…</p>
    <div class="rule"></div>
  </header>
  <div id="banner"></div>
  <main id="out"></main>
  <footer>
    Unofficial, and built by a student. Hours and menus come from
    <a href="https://dining.columbia.edu">dining.columbia.edu</a> and can change
    without notice — check there before you walk over.
  </footer>
</div>

<script>
/* New York "now", regardless of where the viewer's device thinks it is. */
function nyNow(override) {
  const instant = override ? new Date(override) : new Date();
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/New_York', weekday: 'long', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(instant).map(x => [x.type, x.value]));
  return {
    instant: +instant,
    weekday: p.weekday.toLowerCase(),
    date: `${p.year}-${p.month}-${p.day}`,
    hhmm: +p.hour % 24 * 100 + +p.minute,
  };
}

/* Stored as UTC-naive, e.g. "2026-01-20T05:00:00" -> 2026-01-20T05:00:00Z. */
const asUTC = s => Date.parse(s + 'Z');
const mins = t => Math.floor(t / 100) * 60 + t % 100;

function hhmmText(t) {
  t = ((t % 2400) + 2400) % 2400;
  const h = Math.floor(t / 100), m = String(t % 100).padStart(2, '0');
  return `${h % 12 || 12}:${m} ${h < 12 ? 'AM' : 'PM'}`;
}

/* A break block is one in force that lists no hours on any weekday -- how
   Columbia encodes "Closed for Summer". Its date_to is the last covered
   moment, so the day after it is when the place comes back. */
const hasAnyHours = blk => (blk.days || []).some(
  d => d && !Array.isArray(d) && Object.values(d).some(v => v && v.length));

function reopenAfter(ms) {
  // date_to sits at 23:59 (or midday) NY on the last closed day -> next day.
  // Exactly midnight means the day itself is already the reopening.
  return nyNow(new Date(ms)).hhmm === 0 ? ms : ms + 864e5;
}

const longDate = ms => new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York',
  weekday: 'long', month: 'long', day: 'numeric' }).format(ms);
// Cards repeat this a dozen times during a break, so they get the short form
// and the banner up top carries the full weekday-and-date.
const shortDate = ms => new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York',
  month: 'short', day: 'numeric' }).format(ms);

/* Port of the dining site's own getOpenStatus, with real times attached.
   HHMM ints and the >=2400 wrap for overnight service are theirs; keeping the
   arithmetic identical is the point, so we agree with the official site. */
function statusOf(loc, now) {
  const windows = [], notes = [], active = [];
  for (const blk of loc.open_hours_fields || []) {
    if ((blk.excluded || []).some(d => d.slice(0, 10) === now.date)) continue;
    if (now.instant < asUTC(blk.date_from) || now.instant > asUTC(blk.date_to)) continue;
    active.push(blk);
    for (const d of blk.days || []) for (const h of d['days_' + now.weekday] || []) windows.push(h);
    for (const t of blk.displayed_hours || []) if (t.title) notes.push(t.title);
  }

  if (active.length && !active.some(hasAnyHours)) {
    // The site's own note ("Closed for Summer") is dropped here: the pill
    // already says it, and the reopening date is the part nobody had before.
    const last = Math.max(...active.map(b => asUTC(b.date_to)));
    return { state: 'break', label: `Reopens ${shortDate(reopenAfter(last))}`,
             reopens: reopenAfter(last), notes: [] };
  }

  const spans = windows.map(w => {
    let from = +w.hours_from, to = +w.hours_to;
    if (from >= to) { if (now.hhmm < from) from -= 2400; else to += 2400; }  // overnight
    return { from, to };
  }).sort((a, b) => a.from - b.from);

  for (const s of spans) {
    if (s.from <= now.hhmm && now.hhmm <= s.to) {
      const closing = now.hhmm >= s.to - 100;
      return { state: closing ? 'closing' : 'open',
               label: closing ? `Closes ${hhmmText(s.to)}` : `Open until ${hhmmText(s.to)}`, notes };
    }
    if (now.hhmm < s.from) {
      return { state: now.hhmm >= s.from - 100 ? 'opening' : 'closed',
               label: `Opens ${hhmmText(s.from)}`, notes };
    }
  }
  return { state: 'closed', label: spans.length ? 'Closed for today' : 'Closed', notes };
}

/* Display-only spans for the ribbon: the whole day laid out, independent of
   what time it is now (statusOf's wrap is relative to now and would distort
   the drawing). */
function daySpans(loc, now) {
  const out = [];
  for (const blk of loc.open_hours_fields || []) {
    if ((blk.excluded || []).some(d => d.slice(0, 10) === now.date)) continue;
    if (now.instant < asUTC(blk.date_from) || now.instant > asUTC(blk.date_to)) continue;
    for (const d of blk.days || []) for (const h of d['days_' + now.weekday] || []) {
      const from = +h.hours_from;
      let to = +h.hours_to;
      if (to <= from) to += 2400;   // runs past midnight
      out.push({ from, to });
    }
  }
  return out.sort((a, b) => a.from - b.from);
}

const STALE_AFTER_HOURS = 12;
const RANK = { open: 0, closing: 1, opening: 2, closed: 3, break: 4 };
const PILL = { open: 'Open', closing: 'Closing soon', opening: 'Opens soon',
               closed: 'Closed', break: 'Closed for break' };

/* Ribbon rows need names that never run past two lines in the gutter, or the
   bars stop lining up. Rules rather than a lookup table, so a location
   Columbia adds later still shortens sensibly. */
const shortName = n => n
  .replace(/^Blue Java (Caf[ée] )?(at |- )?/, '')
  .replace(/^Chef Don's Pizza Pi.*/, 'Pizza Pi')
  .replace(/ featuring Blue Java$/, '')
  .replace(/, Mudd Hall$/, '')
  .replace(/ Dining Hall$/, '')
  .replace(/ Booth Commons$/, '')
  .replace(/ Library( Caf[ée])?$/, '')
  .replace(/ (Sub Shop|Food Truck)$/, '')
  .replace(/^Faculty House /, 'Fac House ')
  .replace(/ (\d+)(?:st|nd|rd|th) Floor$/, ' $1F')
  .replace(/ Caf[ée]$/, '')
  .replace(/^The /, '')
  .trim();

/* --- rendering --- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* The dining day runs 6am to 6am, not midnight to midnight: JJ's Place serves
   until 10am and students look it up at 2am. statusOf() already works this
   way (that is what its 2400 wraparound is for) -- the dial has to agree, or
   the hero goes blank exactly during the late-night hours it is most needed. */
const DIAL_FROM = 6 * 60, DIAL_TO = 30 * 60;
const pct = m => (Math.min(Math.max(m, DIAL_FROM), DIAL_TO) - DIAL_FROM)
                 / (DIAL_TO - DIAL_FROM) * 100;
// Before 6am we are still in the previous day's dial, at hour 24+.
const dialHHMM = hhmm => hhmm < 600 ? hhmm + 2400 : hhmm;

function dialHTML(groups, now) {
  const tick = h => {
    const t = h % 24;
    return t === 0 ? '12a' : t === 12 ? '12p' : t > 12 ? (t - 12) + 'p' : t + 'a';
  };
  const ticks = [6, 9, 12, 15, 18, 21, 24, 27].map(h =>
    `<span style="left:${pct(h * 60)}%">${tick(h)}</span>`).join('');

  const rowHTML = ({ loc, spans, st }) => {
    const bars = spans.map(s => {
      const l = pct(mins(s.from)), r = pct(mins(s.to));
      const spill = mins(s.to) > DIAL_TO ? ' spill' : '';
      // Fraction of this window already behind us -- drawn as shadow.
      const spent = Math.min(Math.max(
        (mins(dialHHMM(now.hhmm)) - mins(s.from)) / (mins(s.to) - mins(s.from)), 0), 1) * 100;
      return `<div class="bar${spill}" style="left:${l}%;width:${Math.max(r - l, .8)}%">${
        spent > 0 ? `<i style="width:${spent}%"></i>` : ''}</div>`;
    }).join('');
    const readable = spans.map(s => `${hhmmText(s.from)} to ${hhmmText(s.to)}`).join(', ');
    return `<div class="row${st.state === 'open' || st.state === 'closing' ? '' : ' shut'}">
      <span class="rname carved">${esc(shortName(loc.name))}</span>
      <div class="track" role="img" aria-label="${esc(shortName(loc.name))}: ${esc(readable)}">${bars}</div>
    </div>`;
  };

  // Both groups share one time axis -- splitting the dial in two would make
  // the day harder to read, which is the whole point of it.
  const shown = groups.filter(g => g.rows.length);
  const body = shown.map(g => (shown.length > 1
    ? `<div class="row glab"><span class="rname carved">${esc(g.label)}</span><div class="gline"></div></div>`
    : '') + g.rows.map(rowHTML).join('')).join('');

  // The 6am-to-6am window covers every wall-clock time, so the marker always
  // has somewhere to sit.
  const at = pct(mins(dialHHMM(now.hhmm)));
  const pos = `left:calc(var(--gutter) + ${at}% * (100% - var(--gutter)) / 100%)`;
  const marker = `<div class="now" style="${pos}"></div>
       <div class="nowlab mono" style="${pos}">NOW</div>`;

  return `<section class="dial">
    <h2>Today's service</h2>
    <div class="grid"><div class="ticks">${ticks}</div>${body}${marker}</div>
  </section>`;
}

function todaysMenus(data, loc, now) {
  const dayStart = asUTC(now.date + 'T00:00:00'), dayEnd = dayStart + 864e5;
  return data.menus
    .filter(m => m.location_nids.includes(loc.nid))
    .filter(m => asUTC(m.date_to) >= dayStart && asUTC(m.date_from) < dayEnd)
    .sort((a, b) => asUTC(a.date_from) - asUTC(b.date_from));
}

function nyHHMM(iso) {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York',
    hour: '2-digit', minute: '2-digit', hour12: false }).format(asUTC(iso));
  return +p.slice(0, 2) % 24 * 100 + +p.slice(3, 5);
}

/* One disclosure per meal rather than one for the whole day, so lunch and
   dinner can be open side by side. Deciding between them is the actual
   question -- a single "Today's menu" made you expand everything to compare,
   and collapsing it hid dinner while you were reading lunch. Whatever is being
   served right now starts open. */
function menuHTML(menus, now) {
  if (!menus.length) return '';
  return menus.map(m => {
    const from = nyHHMM(m.date_from), to = nyHHMM(m.date_to);
    const serving = dialHHMM(now.hhmm) >= dialHHMM(from) && dialHHMM(now.hhmm) <= dialHHMM(to);
    const stations = m.stations.filter(s => s.items.length);
    if (!stations.length) return '';
    return `
    <details class="meal"${serving ? ' open' : ''}>
      <summary class="carved">${esc(m.meal || 'Menu')}
        <span class="mono when">${hhmmText(from)}–${hhmmText(to)}</span>
        ${serving ? '<span class="nowtag">now</span>' : ''}</summary>
      ${stations.map(s => `
        <div class="station">
          <strong>${esc(s.name || 'Other')}</strong>
          <ul>${s.items.map(i => `<li>${esc(i.title)}${
            (i.dietary || []).map(d => `<span class="tag">${esc(d)}</span>`).join('')
          }</li>`).join('')}</ul>
        </div>`).join('')}
    </details>`;
  }).join('');
}

function cardHTML(data, loc, now, st, spans) {
  // Columbia's prose hours sometimes disagree with their own structured ones
  // (Everett reads "8 a.m. - 3 p.m." while the data says 14:00). Showing both
  // makes this page look wrong, so once we can state today's windows from the
  // same numbers the status came from, those are what we print. The prose is
  // kept only when there is nothing to compute.
  const second = spans.length
    ? (spans.length > 1 || st.state === 'closed'
        ? `<div class="mono">Today ${spans.map(s =>
             `${hhmmText(s.from)}–${hhmmText(s.to)}`).join(', ')}</div>`
        : '')
    : st.notes.map(n => `<div>${esc(n)}</div>`).join('');

  return `
  <article class="card ${st.state}">
    <div class="top">
      <span class="name carved"><a href="${esc(loc.url)}" target="_blank" rel="noopener">${esc(loc.name)}</a></span>
      <span class="pill ${st.state}">${PILL[st.state]}</span>
    </div>
    <div class="detail">
      ${st.label === PILL[st.state] ? '' : `<div class="lead mono">${esc(st.label)}</div>`}
      ${second}
    </div>
    ${menuHTML(todaysMenus(data, loc, now), now)}
  </article>`;
}

function render(data) {
  const params = new URLSearchParams(location.search);
  const now = nyNow(params.get('now'));

  const age = Date.now() - Date.parse(data.updated_at);
  const m = Math.round(age / 6e4);
  document.getElementById('stamp').textContent =
    new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'long',
      month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      .format(now.instant).toUpperCase()
    + ` · UPDATED ${m < 60 ? m + 'M' : Math.round(m / 60) + 'H'} AGO`;

  const marked = data.locations.map(loc => ({ loc, st: statusOf(loc, now),
                                              spans: daySpans(loc, now) }));

  // Nearly everything shut for a break is the normal state for months at a
  // time. Say it once, and keep those rows out of the ribbon -- eleven empty
  // tracks is noise, not information.
  const halls = marked.filter(r => r.loc.type === 'dining_hall');
  const onBreak = halls.filter(r => r.st.state === 'break');
  const banner = [];
  if (halls.length && onBreak.length === halls.length) {
    const back = Math.min(...onBreak.map(r => r.st.reopens));
    banner.push(`<div class="banner"><strong>The dining halls are closed for the break.</strong>
      They reopen ${longDate(back)}. A few cafés are still serving.</div>`);
  }
  // Scrapes run every three hours and GitHub delays them, so a single missed
  // run is routine. Warn only once several in a row have failed, or the
  // warning becomes background noise and stops meaning anything.
  if (age > STALE_AFTER_HOURS * 3600e3) {
    banner.push(`<div class="banner">This page last reached Columbia
      ${Math.round(m / 60)} hours ago, so the hours below may be out of date.
      Check <a href="https://dining.columbia.edu">dining.columbia.edu</a>.</div>`);
  }
  document.getElementById('banner').innerHTML = banner.join('');

  // Short labels in the ribbon gutter, full ones over the card sections.
  const GROUPS = [['dining_hall', 'Dining halls', 'Dining halls'],
                  ['retail', 'Cafés & retail', 'Cafés']];
  const out = [];

  const serving = GROUPS.map(([type, , label]) => ({ label, rows: marked
    .filter(r => r.loc.type === type && r.spans.length)
    .sort((a, b) => a.spans[0].from - b.spans[0].from || a.loc.name.localeCompare(b.loc.name)) }));
  out.push(serving.some(g => g.rows.length) ? dialHTML(serving, now)
    : `<div class="banner quiet">Nothing is serving anywhere today.</div>`);

  for (const [type, label] of GROUPS) {
    const rows = marked.filter(r => r.loc.type === type)
      .sort((a, b) => RANK[a.st.state] - RANK[b.st.state] || a.loc.name.localeCompare(b.loc.name));
    out.push(`<section class="list"><h2>${label}</h2>
      ${rows.map(r => cardHTML(data, r.loc, now, r.st, r.spans)).join('')}</section>`);
  }
  document.getElementById('out').innerHTML = out.join('');
}

/* --- self-check: `?selftest` --- */
function selftest() {
  const results = [];
  const ok = (name, cond) => results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}`);
  const loc = (from, to, extra = {}) => ({ open_hours_fields: [{
    date_from: '2020-01-01T00:00:00', date_to: '2030-01-01T00:00:00',
    days: [{ days_saturday: [{ hours_from: from, hours_to: to }] }], ...extra }] });
  const at = t => nyNow(`2026-08-08T${t}:00-04:00`);   // a Saturday

  ok('open mid-service',        statusOf(loc('0900', '2100'), at('12:00')).state === 'open');
  ok('closing within the hour', statusOf(loc('0900', '2100'), at('20:30')).state === 'closing');
  ok('opens soon',              statusOf(loc('0900', '2100'), at('08:30')).state === 'opening');
  ok('closed before opening',   statusOf(loc('0900', '2100'), at('06:00')).state === 'closed');
  ok('closed after last call',  statusOf(loc('0900', '2100'), at('22:00')).state === 'closed');
  ok('label names the time',    statusOf(loc('0900', '2100'), at('12:00')).label === 'Open until 9:00 PM');

  // JJ's Place runs noon -> 10am next day.
  ok('overnight, after midnight', statusOf(loc('1200', '1000'), at('02:00')).state === 'open');
  ok('overnight, before close',   statusOf(loc('1200', '1000'), at('23:00')).state === 'open');
  ok('overnight, in the gap',     statusOf(loc('1200', '1000'), at('11:00')).state === 'closed');

  ok('holiday exclusion wins',
    statusOf(loc('0900', '2100', { excluded: ['2026-08-08'] }), at('12:00')).state === 'closed');
  ok('out-of-season block ignored', statusOf({ open_hours_fields: [{
    date_from: '2019-01-01T00:00:00', date_to: '2019-06-01T00:00:00',
    days: [{ days_saturday: [{ hours_from: '0900', hours_to: '2100' }] }] }] },
    at('12:00')).state === 'closed');
  ok('no hours at all', statusOf({ open_hours_fields: [] }, at('12:00')).state === 'closed');
  ok('12-hour formatting', hhmmText(0) === '12:00 AM' && hhmmText(1230) === '12:30 PM'
                        && hhmmText(2530) === '1:30 AM');

  // Break detection: a block in force that lists no hours on any weekday.
  const summer = extra => ({ open_hours_fields: [{
    date_from: '2026-05-20T04:00:00', date_to: '2026-08-26T03:59:00', days: [],
    displayed_hours: [{ title: 'Closed for Summer' }], ...extra }] });
  const s1 = statusOf(summer(), at('12:00'));
  ok('break is its own state',    s1.state === 'break');
  ok('break names the reopening', s1.label === 'Reopens Aug 26');
  ok('break banner date is full', longDate(s1.reopens) === 'Wednesday, August 26');

  // 23:59 and midday on the last closed day both mean "back tomorrow".
  ok('midday end still rolls over', statusOf({ open_hours_fields: [{
    date_from: '2026-05-20T04:00:00', date_to: '2026-08-25T15:59:00', days: [] }] },
    at('12:00')).label === 'Reopens Aug 26');
  // Midnight is already the reopening day, not the day before it.
  ok('midnight end does not roll', statusOf({ open_hours_fields: [{
    date_from: '2026-05-20T04:00:00', date_to: '2026-08-26T04:00:00', days: [] }] },
    at('12:00')).label === 'Reopens Aug 26');

  // Closed today but open other days is an ordinary closure, not a break.
  ok('weekend closure is not a break',
    statusOf({ open_hours_fields: [{ date_from: '2020-01-01T00:00:00',
      date_to: '2030-01-01T00:00:00', days: [{ days_monday: [{ hours_from: '0800',
      hours_to: '1400' }] }] }] }, at('12:00')).state === 'closed');

  // Ribbon geometry: spans are drawn for the whole day, not relative to now.
  const ds = daySpans(loc('1200', '1000'), at('02:00'));
  ok('overnight span is drawn whole', ds.length === 1 && ds[0].from === 1200 && ds[0].to === 3400);
  ok('dial maps 6am to the left edge',  pct(mins(600)) === 0);
  ok('dial maps 6am next day to the right edge', pct(mins(3000)) === 100);
  ok('dial clamps a spill',             pct(mins(3400)) === 100);
  ok('dial puts noon at 25%',           Math.round(pct(mins(1200))) === 25);

  // Late night: the dial's day is 6am-to-6am, so 2am belongs to the dial that
  // started yesterday morning and sits near its right edge, not off the left.
  ok('2am shifts into the previous dial', dialHHMM(200) === 2600);
  ok('noon does not shift',               dialHHMM(1200) === 1200);
  ok('2am is inside the dial',            pct(mins(dialHHMM(200))) > 80
                                       && pct(mins(dialHHMM(200))) < 100);
  ok('5:59am is still inside',            pct(mins(dialHHMM(559))) < 100);
  ok('6am wraps to the left edge',        pct(mins(dialHHMM(600))) === 0);
  // At 2am, JJ's overnight bar must contain the marker and be partly shadowed.
  const jj = daySpans(loc('1200', '1000'), at('02:00'))[0];
  const spent = (mins(dialHHMM(200)) - mins(jj.from)) / (mins(jj.to) - mins(jj.from));
  ok('2am falls inside the overnight bar', spent > 0 && spent < 1);

  const shortNames = {
    'Blue Java Café - Butler Library': 'Butler',
    'Blue Java at Everett Library Café': 'Everett',
    "Blue Java Café at Chef Don's, Mudd Hall": "Chef Don's",
    'Blue Java Café - Uris': 'Uris',
    "Chef Don's Pizza Pi featuring Blue Java": 'Pizza Pi',
    'John Jay Dining Hall': 'John Jay',
    'Ferris Booth Commons': 'Ferris',
    'The Fac Shack': 'Fac Shack',
    "Chef Mike's Sub Shop": "Chef Mike's",
    "Johnny's Food Truck": "Johnny's",
    'Faculty House 2nd Floor': 'Fac House 2F',
    'Faculty House 4th Floor': 'Fac House 4F',
    'Robert F. Smith Dining Hall': 'Robert F. Smith',
    'Lenfest Café': 'Lenfest',
    "JJ's Place": "JJ's Place",
  };
  ok('no ribbon name needs three lines',
    Object.values(shortNames).every(s => s.split(' ').length <= 3));
  for (const [full, want] of Object.entries(shortNames)) {
    ok(`short name: ${full}`, shortName(full) === want);
  }

  const failed = results.filter(r => r.startsWith('FAIL')).length;
  document.body.innerHTML = `<div class="wrap"><h1 class="carved">${
    failed ? failed + ' failed' : 'all passed'}</h1>
    <pre id="selftest" class="mono">${results.join('\n')}</pre></div>`;
}

// Registered after load so it never delays first paint, and skipped under
// ?selftest so the worker can't sit between the tests and the network.
if ('serviceWorker' in navigator && !new URLSearchParams(location.search).has('selftest')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

if (new URLSearchParams(location.search).has('selftest')) {
  selftest();
} else {
  fetch('dining.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(render)
    .catch(e => {
      document.getElementById('stamp').textContent = 'COULD NOT REACH THE DATA';
      document.getElementById('banner').innerHTML =
        `<div class="banner">This page could not load <code>dining.json</code> (${esc(e)}).
         Go to <a href="https://dining.columbia.edu">dining.columbia.edu</a> instead.</div>`;
    });
}
</script>
</body>
</html>
